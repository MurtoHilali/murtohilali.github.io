- id: damia
  title: DAMIA
  date: "2023-04"
  status: completed
  track: tools
  category: Bioinformatics Pipeline
  featured: false
  summary: Pipeline and command line utility for analyzing missense variant protein-protein interfaces in silico.
  details: >-
    Compares wild-type protein complexes predicted with AlphaFold-Multimer
    against the same complexes with missense mutations introduced. Its scripts
    measure Cα and Cβ distances across the interface, find consensus interface
    residues, score Jaccard similarity between wild-type and missense
    interfaces, average PI-score features, and run a U-test between the two.
  stack: [Python, PyMOL, pandas, PI-score]
  specs:
    - { label: Tools, value: 6 CLI Scripts }
    - { label: Input, value: AF-M Complexes }
    - { label: Test, value: Mann–Whitney U }
  links:
    - { label: GitHub Repo, url: "https://github.com/MurtoHilali/damia" }
  post: damia
  thumb: /img/thumb/damia-cover.webp
  thumb_alt: "Abstract cover art: a grid of green and white dots"
  figure: /img/projects/damia-workflow.webp
  figure_alt: "DAMIA overview: UniProt IDs lead to wild-type and missense complexes predicted with AlphaFold2-Multimer, then to interface, distance and PI-score outputs, with U-tests comparing wild-type and missense interfaces."
  figure_width: 800
  figure_height: 1600
  figure_caption: Pipeline overview
  figure_link: "https://github.com/MurtoHilali/damia/blob/main/imgs/workflow.png"
  color: "#009ec5"
  ascii: neural
  icon: network

