  thumb_alt: "Abstract cover art: cyan and yellow blocks on magenta"
  figure: /img/projects/vici-workflow.webp
  figure_alt: "vici flowchart: subset the data, optionally keep only genes with both P/LP and B/LB variants, extract missense residues, search for them in interfaces with PIONEER, and compile the results into a JSON."
