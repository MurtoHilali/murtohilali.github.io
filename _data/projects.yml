- id: vici
  title: VICI
  date: "2023-09"
  status: completed
  track: tools
  category: Command Line Tool
  featured: false
  summary: An open source command line tool to find P/LP and B/LB controls to test AF-M using PIONEER.
  details: >-
    Finds variants of known effect at protein–protein interfaces to use as in
    silico controls. Takes pathogenic and benign variant tables from ClinVar,
    keeps the ones PIONEER places at PPI-encoding sequences, and outputs a JSON
    of positive and negative controls. Built to test AlphaFold-Multimer at
    SickKids.
  stack: [Bash, ClinVar, PIONEER]
  specs:
    - { label: Input, value: ClinVar Tables }
    - { label: Filter, value: PIONEER PPI Sites }
    - { label: Output, value: JSON Controls }
  links:
