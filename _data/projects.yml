# The only place a project is defined. The homepage "Selected work" grid,
# the Lab (/lab/), the About page and llms.txt all render from this file.
#
# Fields
#   id              stable slug; the anchor on /lab/#<id>
#   title, date     date is YYYY-MM
#   headline        optional, longer title for the homepage card (falls back to title)
#   status          active | completed | archived
#   track           research | tools | side   (groups the Lab)
#   category        short label shown in the Lab row
#   featured        true puts it on the homepage, ordered by featured_order
#   summary         one line; the Lab synopsis and the card blurb
#   details         the Lab's expanded paragraph
#   stack           list of tools, shown as chips
#   specs           ordered list of { label, value }; cards show the first three
#   links           { label, url } for external links, or { label, post: <slug> }
#                   for a post on this site
#   post            slug of the main write-up, if there is one. Rendered first,
#                   as "Read the write-up"
#   thumb/thumb_alt card image; with no thumb the card shows a tile built from
#                   `color` and `icon`. thumb_width/thumb_height default to 800x1200.
#                   thumb_fit: contain shows a whole figure on white instead of
#                   cropping it to fill the card
#   figure/figure_alt  a real result figure for the Lab panel; with no figure
#                   the panel shows the ASCII monitor (`ascii`). Also
#                   figure_width/figure_height, figure_caption, and figure_link
#                   (where "Full size" points; defaults to the image itself)
#   color, ascii, icon  Lab styling. icon is a key in _data/icons.yml; ascii is
#                   one of cnn | neural | dna | scan

# ---------------------------------------------------------------- research

- id: cyclospora-rat
  title: Cyclospora RAT Binders
  date: "2026-10"
  status: active
  track: research
  category: Protein Design
  featured: false
  summary: Antigen selection and binder design for a Cyclospora rapid antigen test.
  details: >-
    Picking the surface antigen a rapid antigen test should target in
    Cyclospora cayetanensis, then designing binders against it. A Snakemake
    pipeline transfers annotations across 44 genomes (Liftoff, gffread),
    aligns coding sequences codon-aware (MAFFT, pal2nal) and measures
    selection as pN/pS with SNPGenie, while SignalP, DeepTMHMM, DeepLoc 2,
    PredGPI and InterProScan predict which proteins actually reach the
    surface. Candidates are shortlisted where conservation, localization and
    predicted abundance intersect — abundance from a fine-tuned protein
    language model with calibrated uncertainty — and the shortlist feeds
    peptide and nanobody design for a lateral-flow produce screen.
  stack: [Snakemake, MAFFT, SNPGenie, DeepLoc 2, InterProScan, PyTorch]
  specs:
    - { label: Genomes, value: "44" }
    - { label: Filters, value: "Conservation, Surface, Abundance" }
    - { label: Binders, value: "Peptides, Nanobodies" }
    - { label: Readout, value: Lateral Flow }
  links: []
  post: null
  thumb: null
  thumb_alt: null
  figure: null       # TODO(murto): a figure once there are results to show
  figure_alt: null
  color: "#00c5a7"
  ascii: scan
  icon: antibody

- id: pac-maps
  title: PAC-MAPS
  headline: "PAC-MAPS: classifying protein architecture from contact maps"
  date: "2026-08"
  status: active
  track: research
  category: Deep Learning
  featured: true
  featured_order: 1
  summary: Protein architecture classification from CATH contact maps.
  details: >-
    Classifies CATH architecture straight from structure. Each domain is
    rendered as an RGB contact map — red for inverted Cβ–Cβ distance, green for
    helix–helix pairs, blue for strand–strand pairs — and read by a dilated
    CoordConv residual CNN. Benchmarked out-of-distribution by vaulting whole
    superfamilies out of training, the way DockGen and Chainsaw do.
  stack: [fastai, PyTorch, biotite, W&B]
  specs:
    - { label: Test Accuracy, value: "75.0%" }
    - { label: Balanced Acc., value: "68.3%" }
    - { label: Classes, value: 14 Architectures }
    - { label: Benchmark, value: Held-out Superfamilies }
  links:
    - { label: GitHub Repo, url: "https://github.com/MurtoHilali/pac-maps" }
  post: null
  thumb: /img/projects/pac-maps-card.webp   # three panels of figures/prediction_gallery.png
  thumb_alt: "Three RGB contact maps: a helix-rich orthogonal bundle (green blocks), a 7-bladed propeller (blue) and a beta barrel (purple)"
  thumb_width: 1000
  thumb_height: 328
  figure: /img/projects/pac-maps-gallery.webp
  figure_alt: "Twelve RGB contact maps from held-out test superfamilies, each labelled with its true and predicted CATH architecture. The top two rows are confident correct predictions, the bottom row the most confident errors."
  figure_width: 1200
  figure_height: 932
  figure_caption: Predictions on held-out superfamilies
  figure_link: "https://github.com/MurtoHilali/pac-maps/blob/main/figures/prediction_gallery.png"
  color: "#c500ff"
  ascii: cnn
  icon: matrix

- id: acarbose-alternatives
  title: Acarbose Alternatives
  headline: Structure-based virtual screen to find 71 natural alternatives to acarbose
  date: "2026-02"
  status: completed
  track: research
  category: Virtual Screening
  featured: true
  featured_order: 2
  summary: In silico drug discovery for Acarbose alternatives.
  details: >-
    Identified 71 natural alternatives to a $200 million drug entirely in
    silico. Screened the COCONUT natural-products database by chemical
    similarity to acarbose, then docked the survivors with GNINA — an AutoDock
    Vina fork that scores poses with a CNN — and ranked them on CNN-VS. Decoys,
    redocking replicates, and stability analysis stripped out the false
    positives.
  stack: [GNINA, RDKit, OpenBabel, ChimeraX]
  specs:
    - { label: Hits Identified, value: "71" }
    - { label: Target, value: A-Glucosidase }
    - { label: Scoring, value: CNN-VS }
    - { label: Library, value: COCONUT }
  links:
    - { label: GitHub Repo, url: "https://github.com/MurtoHilali/Acarbose-Alternative-Drug-Discovery" }
    - { label: Pipeline Post, post: acarbose-alternative-drug-discovery }
  post: acarbose-alternative-drug-discovery
  thumb: /img/projects/aadd-docking-targets.webp   # from the write-up
  thumb_alt: "The docking targets 2QMJ, 3BAJ and 5NN8 as protein surfaces, each with the GNINA search box drawn in red around bound acarbose"
  thumb_width: 1305
  thumb_height: 545
  thumb_fit: contain
  figure: /img/projects/aadd-workflow.webp
  figure_alt: "Workflow: COCONUT natural products are narrowed by molecular-fingerprint similarity to acarbose to about 10k candidates, docked with GNINA against 2QMJ, 3BAJ and 5NN8, then checked against decoys and redocking replicates to give the top candidates."
  figure_width: 1462
  figure_height: 530
  figure_caption: Screening workflow
  figure_link: "https://github.com/MurtoHilali/Acarbose-Alternative-Drug-Discovery/blob/main/figures/aadd-workflow.drawio.png"
  color: "#ff3300"
  ascii: scan
