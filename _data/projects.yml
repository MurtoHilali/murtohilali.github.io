- id: af-m-ppi
  title: AF-M PPI Prediction
  headline: Predicting how missense variants disrupt protein–protein interactions with AI
  date: "2024-05"
  status: completed
  track: research
  category: Bioinformatics Pipeline
  featured: true
  featured_order: 3
  summary: Predicting missense mutation effects on PPIs.
  details: >-
    Utilized over 47,000 SLURM jobs to generate AlphaFold-Multimer predictions
    for wild-type and mutant protein complexes. Structural features were
    extracted to train an XGBoost classifier, achieving a 91% AUC for
    predicting PPI disruption.
  stack: [AlphaFold-M, XGBoost, Bash]
  specs:
    - { label: AUC, value: "0.91" }
    - { label: Jobs Run, value: "47,000+" }
    - { label: Target, value: Missense Variants }
  links:
    - { label: Read Write-up, post: xgboost-ppi }
    - { label: "Related: Nature Genetics paper", url: "https://doi.org/10.1038/s41588-024-01686-x" }
  post: xgboost-ppi
  thumb: /img/projects/af-m-complexes.webp   # cover image from the write-up
  thumb_alt: "Two AlphaFold-Multimer predictions of the same protein complex side by side: the wild-type pair highlighted in green, the p.Arg72Tyr variant pair in red"
  thumb_width: 1100
  thumb_height: 743
  thumb_fit: contain
  figure: /img/projects/af-m-roc-curve.webp   # from the xgboost-ppi post
  figure_alt: "Multi-class ROC curves for the XGBoost classifier: per-class AUCs of 0.81, 0.85, 0.96 and 0.97, and a micro-average AUC of 0.91, all well above the random-chance diagonal."
  figure_width: 846
  figure_height: 699
  figure_caption: Multi-class ROC and AUC
  figure_link: /img/articles/xgboost-ppi/roc-curve.png
  color: "#00c53a"
  ascii: dna
  icon: dna

