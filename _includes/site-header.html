{%- comment -%}
  The one header every page shares: name home link, main nav, theme toggle.
  Used by _layouts/default.html and _layouts/lab.html.
{%- endcomment -%}
{%- assign _url = page.url -%}
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}"{% if _url == '/' %} aria-current="page"{% endif %}>{{ site.author.name }}</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="{{ '/lab/' | relative_url }}"{% if _url == '/lab/' %} aria-current="page"{% endif %}>Lab</a></li>
        <li><a href="{{ '/blog/' | relative_url }}"{% if _url == '/blog/' %} aria-current="page"{% elsif page.collection == 'posts' %} aria-current="true"{% endif %}>Writing</a></li>
        <li><a href="{{ '/about/' | relative_url }}"{% if _url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/resume.pdf' | relative_url }}">CV</a></li>
      </ul>
      <button id="theme-toggle" class="theme-toggle" type="button" onclick="modeSwitcher()" aria-label="Dark theme" aria-pressed="false" title="Toggle dark theme"><span></span></button>
    </nav>
  </div>
</header>
