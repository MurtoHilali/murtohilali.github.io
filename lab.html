    let audioCtx = null;

    const initAudio = () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    };

    const playSound = (type, index = 0) => {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'hover') {
          // Buttery mechanical "tap", pitch shifts down based on row index
          osc.type = 'sine';
          const baseFreq = 500 - (index * 80); 
          
          osc.frequency.setValueAtTime(baseFreq * 1.5, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(baseFreq, audioCtx.currentTime + 0.015);
          
          gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
          gainNode.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.002);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
          
          osc.start();
          osc.stop(audioCtx.currentTime + 0.025);
        } else if (type === 'click') {
          // Deeper, chunky mechanical clack
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.05);
          gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        }
      } catch (e) {
        console.warn("Audio not supported or blocked", e);
      }
    };

    function generatePixelIcon(grid, color, isActive) {
      const activeColor = isActive ? color : '#2D2A26';
      const nonActiveOpacity = isActive ? '1' : '0.5';
      
      let cells = '';
      grid.forEach(row => {
        row.split('').forEach(cell => {
          const bg = cell !== '.' ? activeColor : 'transparent';
          cells += `<div class="aspect-square" style="background-color: ${bg}; opacity: ${cell !== '.' ? nonActiveOpacity : '1'}"></div>`;
        });
      });

      return `
        <div class="grid grid-cols-[repeat(16,minmax(0,1fr))] w-4 h-4 sm:w-5 sm:h-5 shrink-0 transition-all duration-200 pixelated">
          ${cells}
        </div>
      `;
    }

    let expandedIndex = null;

      playSound('click');

      const headerId = `header-${index}`;
      const iconContainerId = `icon-${index}`;

      const header = document.getElementById(headerId);
      const iconContainer = document.getElementById(iconContainerId);
      const proj = PROJECTS[index];

      // Close previously expanded if different
      if (expandedIndex !== null && expandedIndex !== index) {
        const prevContent = document.getElementById(`content-${expandedIndex}`);
        const prevHeader = document.getElementById(`header-${expandedIndex}`);
        const prevIcon = document.getElementById(`icon-${expandedIndex}`);
        const prevProj = PROJECTS[expandedIndex];

        prevContent.classList.remove('opacity-100', 'border-b-[3px]', 'border-[#2D2A26]');
        prevContent.classList.add('opacity-0');
        prevHeader.style.backgroundColor = 'transparent';
        prevIcon.innerHTML = generatePixelIcon(prevProj.pixelGrid, prevProj.colorHex, false);

        content.classList.remove('opacity-100', 'border-b-[3px]', 'border-[#2D2A26]');
        content.classList.add('opacity-0');
        header.style.backgroundColor = 'transparent';
        iconContainer.innerHTML = generatePixelIcon(proj.pixelGrid, proj.colorHex, false);
        expandedIndex = null;

      'I': [" III ", "  I  ", "  I  ", "  I  ", " III "],
      'J': ["  JJJ", "   J ", "   J ", "J  J ", " JJ  "],
      'K': ["K   K", "K  K ", "KKK  ", "K  K ", "K   K"],
      'L': ["L    ", "L    ", "L    ", "L    ", "LLLLL"],
      'M': ["M   M", "MM MM", "M M M", "M   M", "M   M"],
      'N': ["N   N", "NN  N", "N N N", "N  NN", "N   N"],
      'O': [" OOO ", "O   O", "O   O", "O   O", " OOO "],
      'P': ["PPPP ", "P   P", "PPPP ", "P    ", "P    "],
      'Q': [" QQQ ", "Q   Q", "Q   Q", "Q  QQ", " QQ Q"],
      'R': ["RRRR ", "R   R", "RRRR ", "R  R ", "R   R"],
      'S': [" SSS ", "S    ", " SSS ", "    S", " SSS "],
      'T': ["TTTTT", "  T  ", "  T  ", "  T  ", "  T  "],
      'U': ["U   U", "U   U", "U   U", "U   U", " UUU "],
      'V': ["V   V", "V   V", "V   V", " V V ", "  V  "],
      'W': ["W   W", "W   W", "W W W", "WW WW", "W   W"],
      'X': ["X   X", " X X ", "  X  ", " X X ", "X   X"],
      'Y': ["Y   Y", " Y Y ", "  Y  ", "  Y  ", "  Y  "],
      'Z': ["ZZZZZ", "   Z ", "  Z  ", " Z   ", "ZZZZZ"],
      ' ': ["     ", "     ", "     ", "     ", "     "],
      '/': ["    /", "   / ", "  /  ", " /   ", "/    "]
    };

    let fontLines = ["", "", "", "", ""];
    for (let i = 0; i < tickerText.length; i++) {
      const charBlock = alphabet[tickerText[i]] || alphabet[' '];
      for (let j = 0; j < 5; j++) { fontLines[j] += charBlock[j] + "  "; }
    }
    const tickerW = fontLines[0].length * 2; // Repeat twice

    function renderLoop() {
      time += 0.015;

      // 1. Update active monitors
      animators.forEach(el => {
        const idx = parseInt(el.dataset.index);
        if (expandedIndex !== idx) return; // Save CPU, don't render hidden elements

        const type = el.dataset.type;
        const W = 46; 
        const H = 22; 
        let frameString = "";

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            let val = 0;
            const nx = (x / W) * 2 - 1;
            const ny = (y / H) * 2 - 1;
            
            if (type === 'cnn') {
              const gridX = Math.abs(Math.sin(nx * 8));
              const gridY = Math.abs(Math.sin(ny * 8));
              const isGridLine = gridX < 0.2 || gridY < 0.2;
              
              const scanX = Math.sin(time * 1.5) * 0.6;
              const scanY = Math.cos(time * 1.1) * 0.6;
              const dx = Math.abs(nx - scanX);
              const dy = Math.abs(ny - scanY);
              
              const inFilter = dx < 0.25 && dy < 0.25;
              const isFilterBorder = (dx < 0.3 && dy < 0.3) && !inFilter;

              if (isFilterBorder) val = 0.9; 
              else if (inFilter) val = 0.6 + Math.sin(nx * 30 + ny * 30 - time * 20) * 0.4;
              else if (isGridLine) val = 0.15; 
              else val = 0.02; 
            }
            else if (type === 'neural') {
              const cx1 = nx + Math.sin(time * 0.8) * 0.5;
              const cy1 = ny + Math.cos(time * 1.2) * 0.5;
              const cx2 = nx - Math.cos(time * 1.5) * 0.3;
              const cy2 = ny - Math.sin(time * 0.7) * 0.3;
              const d1 = Math.sqrt(cx1*cx1 + cy1*cy1);
              const d2 = Math.sqrt(cx2*cx2 + cy2*cy2);
              val = (Math.sin(d1 * 8 - time * 3) + Math.cos(d2 * 10 + time * 2) + 2) / 4;
            }
            else if (type === 'dna') {
              const wave1 = Math.sin(ny * 4 + time * 3) * 0.6;
              const wave2 = Math.sin(ny * 4 + time * 3 + Math.PI) * 0.6;
              const d1 = Math.abs(nx - wave1);
              const d2 = Math.abs(nx - wave2);
              if (d1 < 0.1 || d2 < 0.1) val = 0.9;
              else if (Math.abs(wave1 - wave2) > 0.2 && nx > Math.min(wave1, wave2) && nx < Math.max(wave1, wave2) && (y % 2 === 0)) val = 0.4;
              else val = Math.max(0, 0.1 - Math.abs(nx));
            }
            else if (type === 'scan') {
              const angle = Math.atan2(ny, nx);
              const dist = Math.sqrt(nx*nx + ny*ny);
              let radar = (angle + time * 2) % (Math.PI * 2);
              if (radar < 0) radar += Math.PI * 2;
              const radarPulse = 1.0 - (radar / (Math.PI * 2));
              const ring = Math.abs(Math.sin(dist * 15 - time * 4));
              val = (radarPulse * ring) + (dist < 0.8 && dist > 0.75 ? 0.8 : 0);
            }

            val = Math.max(0, Math.min(1, val));
            frameString += DENSITY[Math.floor(val * (DENSITY.length - 1))];
          }
          frameString += "\n";
        }
        el.innerText = frameString;
      });

      // 2. Update bottom ticker
      let tickerFrame = "";
      for (let y = 0; y < 5; y++) {
        for (let x = 0; x < tickerW; x++) {
          const localX = x % (tickerW / 2);
          const isLetter = fontLines[y][localX] !== ' ';
          
          const nx = x * 0.1;
          const ny = y * 0.2;
          const noise = (Math.sin(nx + time) + Math.cos(ny - time * 0.8) + Math.sin(nx * 0.5 + ny * 0.5 + time * 1.5)) / 3; 
          const normalizedNoise = (noise + 1) / 2;

          if (isLetter) {
            tickerFrame += TICKER_DENSITY[Math.min(TICKER_DENSITY.length - 1, 5 + Math.floor(normalizedNoise * 4.99))];
          } else {
            tickerFrame += TICKER_DENSITY[Math.min(TICKER_DENSITY.length - 1, Math.floor(normalizedNoise * 2.99))];
          }
        }
        tickerFrame += "\n";
      }
      
      document.getElementById('ticker1').innerText = tickerFrame;
      document.getElementById('ticker2').innerText = tickerFrame;

      requestAnimationFrame(renderLoop);
    }

    // Start loop
    renderLoop();
  </script>
</body>
