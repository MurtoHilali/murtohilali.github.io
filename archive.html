---
layout: default
title: Archive
---


<section>
    <h1 class="archive-title">Archive</h1>
	
    <div class="search-article">
	    <label for="search-input" class="visually-hidden">Search the archive</label>
	    <span aria-hidden="true">
		<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
		    stroke="rgba(128,128,128,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
		    class="feather feather-search">
		    <circle cx="11" cy="11" r="8"></circle>
		    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
		</svg>
	    </span>

	    <input type="search" id="search-input" placeholder="Find some articles here" onkeyup="searchFunction()">
    </div>

    <div id="myIndexList" class="archive-list">
        {%- assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
        {%- for year in years %}
        <h2 class="archive-year">{{ year.name }}</h2>
        <ul>
            {%- for post in year.items %}
            <li class="anilink"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
            {%- endfor %}
        </ul>
        {%- endfor %}
    </div>
</section>
