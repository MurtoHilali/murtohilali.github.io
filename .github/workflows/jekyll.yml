# Build check only -- this does NOT deploy.
#
# The live site is built by GitHub Pages itself from `main` (Settings ->
# Pages, legacy build, custom domain murto.co). This workflow exists so a
# broken build is caught on `development` or in a PR, before it reaches
# the branch that is actually served.
name: Build check

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors the Pages build, so a failure here means a failure there.
      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check the pages we care about were produced
        run: |
          set -e
          # Pages are emitted as <name>/index.html, either from the pretty
          # permalink style or from an explicit permalink in their front matter.
          for f in _site/index.html _site/lab/index.html _site/travels/index.html _site/blog/index.html _site/llms.txt; do
            [ -s "$f" ] || { echo "::error::$f missing or empty"; exit 1; }
          done
          count=$(find _site -name '*.html' | wc -l | tr -d ' ')
          [ "$count" -ge 10 ] || { echo "::error::only $count HTML pages built"; exit 1; }
          echo "Built $count HTML pages."

      - name: Show what was built
        if: always()
        run: find _site -maxdepth 1 | sort
