# Build check only -- this does NOT deploy.
#
# The live site is built by GitHub Pages itself from `main` (Settings ->
# Pages, legacy build, custom domain murto.co). This workflow exists so a
# broken build is caught on `development` or in a PR, before it reaches
# the branch that is actually served.
name: Build check

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors the Pages build, so a failure here means a failure there.
      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check the pages we care about were produced
        run: |
          set -e
          # Pages are emitted as <name>/index.html, either from the pretty
          # permalink style or from an explicit permalink in their front matter.
          for f in _site/index.html _site/lab/index.html _site/travels/index.html _site/blog/index.html _site/about/index.html _site/llms.txt _site/resume.pdf _site/cv/index.html; do
            [ -s "$f" ] || { echo "::error::$f missing or empty"; exit 1; }
          done
          count=$(find _site -name '*.html' | wc -l | tr -d ' ')
          [ "$count" -ge 10 ] || { echo "::error::only $count HTML pages built"; exit 1; }
          echo "Built $count HTML pages."

      # Internal links (including #anchors like /lab/#pac-maps), image alt
      # attributes and script paths. External links are skipped to keep it
      # fast. Pinned to html-proofer 4.4.3: 5.2.2 reported "Checking 0
      # internal links" when tried locally, because its async file loop
      # returned no results, so it would have passed anything.
      # --allow-missing-href and --enforce-https=false only cover post
      # bodies: one has an empty href="", three link to http:// sites.
      - name: Set up Ruby for htmlproofer
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Check internal links and image alt text
        run: |
          gem install html-proofer -v 4.4.3 --no-document
          htmlproofer ./_site \
            --disable-external=true \
            --checks Links,Images,Scripts \
            --allow-missing-href=true \
            --enforce-https=false

      - name: Show what was built
        if: always()
        run: find _site -maxdepth 1 | sort
