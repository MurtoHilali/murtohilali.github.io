---
layout: compress
---

<!DOCTYPE html>
<html lang="en">
{% include head.html %}

<body>
  <!-- Lazysizes script should be in body or head -->
  <script src="https://afarkas.github.io/lazysizes/lazysizes.min.js" async=""></script>
  
  <script>
    function setTheme(theme) {
      try {
         if (theme === "dark") {
            document.documentElement.setAttribute('data-theme', 'dark');
            window.localStorage.setItem('theme', 'dark');
            var toggle = document.getElementById("theme-toggle");
            if(toggle) {
                toggle.classList.add('sun');
                toggle.classList.remove('moon');
            }
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            window.localStorage.setItem('theme', 'light');
            var toggle = document.getElementById("theme-toggle");
            if(toggle) {
                toggle.classList.add('moon');
                toggle.classList.remove('sun');
            }
        }
      } catch (error) {
        console.log('Theme error', error);
      }
    }

    let theme = localStorage.getItem('theme');
    theme = theme || (window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' : 'light');
    setTheme(theme);

    function modeSwitcher() {
      let currentMode = document.documentElement.getAttribute('data-theme');
      if (currentMode === "dark") {
        setTheme('light');
      } else {
        setTheme('dark');
      }
    }
  </script>

  <main>
    {% if page.no_anchors %}
      {{ content }}
    {% else %}
      {% include anchor_headings.html html=content anchorBody="#" %}
    {% endif %}
  </main>

  <!-- Footer moved INSIDE body -->
  {% include footer.html %}

  {% if page.url == '/archive/' or page.url == '/notes/' %}
   <script src="{{ site.url }}{{ site.baseurl }}/assets/js/custom-search.js"></script>
  {% endif %}

</body>
</html>
