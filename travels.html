---
layout: clean
title: Travels
---

<script src="//unpkg.com/globe.gl"></script>

<style>
  /* Page Structure */
  .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: var(--code-bg-color);
  }

  /* Header / Nav */
  .app-header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: #fff; /* Ensure header has background */
      z-index: 10;
      border-bottom: 1px solid var(--soft-border-color);
  }

  /* Main Split View */
  .split-view {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
  }

  /* LEFT PANEL: Info & Links */
  .info-panel {
      width: 400px;
      background: #fff;
      border-right: 1px solid var(--soft-border-color);
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      flex-shrink: 0; 
      z-index: 5;
  }

  /* RIGHT PANEL: Globe Container */
  .globe-panel {
      flex: 1; 
      position: relative;
      background: #f4f4f4; /* CHANGED: Light grey background to contrast with white globe */
      cursor: grab;
      overflow: hidden; /* Prevent canvas scrollbars */
  }
  
  .globe-panel:active {
      cursor: grabbing;
  }

  /* Cards */
  .think-card {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: 0.2s;
      color: #333;
      text-decoration: none;
  }
  .think-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border-color: var(--link-color);
  }

  /* Mobile */
  @media (max-width: 768px) {
      .split-view { flex-direction: column-reverse; }
      .info-panel { width: 100%; height: 40vh; border-right: none; border-top: 1px solid #ccc; }
      .globe-panel { flex: 1; }
  }
</style>

<div class="app-container">
    
    <div class="app-header">
        <a href="{{ site.url }}{{ site.baseurl }}/" style="font-weight: bold; font-family: sans-serif; font-size: 1.2rem; color: #333; text-decoration: none;">
            <i class="fa fa-arrow-left"></i> Home
        </a>
        <button title="Change theme" id="theme-toggle" onclick="modeSwitcher()" style="background:none; border:none; cursor:pointer;">
             <div></div>
        </button>
    </div>

    <div class="split-view">
        
        <div class="info-panel" id="info-panel">
            <div style="text-align: center; margin-top: 40%; opacity: 0.6; color: #555;">
                <h3 style="font-size: 2rem; margin-bottom: 1rem;">🌍</h3>
                <p>Spin the globe.<br>Click a highlighted country to view field notes.</p>
            </div>
        </div>

        <div class="globe-panel" id="globe-viz"></div>

    </div>
</div>

<script>
    /* 1. Prepare Data */
    const visitedData = [
        {% if site.data.travels %}
            {% for trip in site.data.travels %}
            {
                id: "{{ trip.id }}",
                country: "{{ trip.country }}",
                color: "{{ trip.color }}",
                posts: [
                    {% for post in trip.posts %}
                    {
                        title: "{{ post.title }}",
                        type: "{{ post.type }}",
                        url: "{{ post.url }}",
                        icon: "{{ post.icon | default: 'fa-link' }}"
                    },
                    {% endfor %}
                ]
            },
            {% endfor %}
        {% endif %}
    ];

    const visitedMap = new Map(visitedData.map(d => [d.id, d]));

    /* 2. Init Globe */
    document.addEventListener('DOMContentLoaded', () => {
        const globeContainer = document.getElementById('globe-viz');
        
        /* Debug: Ensure container has size before loading */
        console.log("Container Size:", globeContainer.clientWidth, globeContainer.clientHeight);

        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(countries => {
                
                const world = Globe()
                    (globeContainer)
                    .backgroundColor('#f4f4f4') /* Match CSS background */
                    .globeImageUrl(null)        /* No texture = White Material */
                    .showAtmosphere(false)      /* FIX: Remove glow to prevent washout */
                    
                    /* Dimensions */
                    .width(globeContainer.clientWidth)
                    .height(globeContainer.clientHeight)
                    
                    /* Polygons */
                    .polygonsData(countries.features)
                    .polygonCapColor(d => {
                        const data = visitedMap.get(d.properties.ISO_A3);
                        return data ? data.color : '#ffffff'; /* White for unvisited */
                    })
                    .polygonSideColor(() => '#cccccc')
                    .polygonStrokeColor(() => '#111111') /* Black Borders */
                    .polygonStrokeWidth(0.5)             /* FIX: Make sure borders are thick enough */
                    .polygonAltitude(0.01)

                    /* Events */
                    .onPolygonClick(d => {
                        const iso = d.properties.ISO_A3;
                        const data = visitedMap.get(iso);
                        if (data) {
                            renderPanel(data);
                            
                            /* Smooth Fly to location */
                            const centroid = getCentroid(d.geometry);
                            world.pointOfView({ lat: centroid[1], lng: centroid[0], altitude: 1.8 }, 1000);
                        }
                    })
                    .onPolygonHover(d => {
                        globeContainer.style.cursor = (d && visitedMap.has(d.properties.ISO_A3)) ? 'pointer' : 'grab';
                    });

                /* Controls */
                world.controls().autoRotate = true;
                world.controls().autoRotateSpeed = 0.5;
                world.controls().enableZoom = true;
                
                /* Set initial view distance */
                world.pointOfView({ altitude: 2.5 });

                /* Responsive Resize */
                window.addEventListener('resize', () => {
                    world.width(globeContainer.clientWidth);
                    world.height(globeContainer.clientHeight);
                });
            })
            .catch(err => console.error("Globe Data Error:", err));
    });

    function renderPanel(data) {
        const panel = document.getElementById('info-panel');
        
        /* Check if posts exist */
        const cards = data.posts && data.posts.length > 0 
            ? data.posts.map(post => `
                <a href="${post.url}" target="_blank" class="think-card">
                    <i class="fa ${post.icon}" style="font-size: 1.5em; width: 30px; text-align: center; color: ${data.color}"></i>
                    <div>
                        <div style="font-weight: bold;">${post.title}</div>
                        <div style="font-size: 0.8em; opacity: 0.7;">${post.type}</div>
                    </div>
                    <div style="margin-left: auto; opacity: 0.3;"><i class="fa fa-external-link"></i></div>
                </a>
            `).join('')
            : `<p style="opacity:0.5; font-style:italic;">No notes added yet.</p>`;

        panel.innerHTML = `
            <div style="animation: fadeIn 0.3s ease;">
                <h1 style="font-family: sans-serif; font-size: 2.5rem; margin-bottom: 0;">${data.country}</h1>
                <div style="height: 4px; width: 60px; background: ${data.color}; margin-bottom: 2rem; border-radius: 2px;"></div>
                ${cards}
            </div>
        `;
    }

    /* Helper: Calculate center of polygon for camera */
    function getCentroid(geometry) {
        let coords = geometry.coordinates[0];
        /* Handle MultiPolygon by taking the first ring of the first polygon */
        if (geometry.type === 'MultiPolygon') coords = coords[0];
        
        let minX = 180, maxX = -180, minY = 90, maxY = -90;
        coords.forEach(pt => {
            if (pt[0] < minX) minX = pt[0];
            if (pt[0] > maxX) maxX = pt[0];
            if (pt[1] < minY) minY = pt[1];
            if (pt[1] > maxY) maxY = pt[1];
        });
        return [(minX + maxX) / 2, (minY + maxY) / 2];
    }
</script>
