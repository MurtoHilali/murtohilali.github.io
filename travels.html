---
layout: clean
title: Travels
---

<script src="//unpkg.com/globe.gl"></script>

<style>
  /* Page Structure */
  .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh; /* Force full viewport height */
      width: 100vw;
      background: var(--code-bg-color);
  }

  /* Header / Nav */
  .app-header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0; /* Prevent header from shrinking */
  }

  /* Main Split View */
  .split-view {
      display: flex;
      flex: 1; /* Take up remaining height */
      overflow: hidden;
      border-top: 1px solid var(--soft-border-color);
  }

  /* LEFT PANEL: Info & Links */
  .info-panel {
      width: 400px; /* Fixed width for consistency */
      background: var(--code-bg-color);
      border-right: 1px solid var(--soft-border-color);
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      flex-shrink: 0; 
  }

  /* RIGHT PANEL: Globe */
  .globe-panel {
      flex: 1; /* Takes all remaining width */
      position: relative;
      background: #ffffff; /* Globe background */
      cursor: grab;
  }
  
  .globe-panel:active {
      cursor: grabbing;
  }

  /* Cards */
  .think-card {
      background: var(--ilgb-bg-color);
      border: 1px solid var(--soft-border-color);
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: 0.2s;
      color: var(--main-text-color);
  }
  .think-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border-color: var(--link-color);
  }

  /* Mobile */
  @media (max-width: 768px) {
      .split-view { flex-direction: column-reverse; }
      .info-panel { width: 100%; height: 40vh; border-right: none; border-top: 1px solid var(--soft-border-color); }
      .globe-panel { flex: 1; }
  }
</style>

<div class="app-container">
    
    <div class="app-header">
        <a href="{{ site.url }}{{ site.baseurl }}/" style="font-weight: bold; font-family: var(--header-font); font-size: 1.2rem;">
            <i class="fa fa-arrow-left"></i> Home
        </a>
        <button title="Change theme" id="theme-toggle" onclick="modeSwitcher()" style="background:none; border:none; cursor:pointer;">
             <div></div>
        </button>
    </div>

    <div class="split-view">
        
        <div class="info-panel" id="info-panel">
            <div style="text-align: center; margin-top: 40%; opacity: 0.6;">
                <h3>🌍</h3>
                <p>Select a highlighted country<br>to view notes.</p>
            </div>
        </div>

        <div class="globe-panel" id="globe-viz"></div>

    </div>
</div>

<script>
    // 1. Prepare Data
    // We explicitly check if site.data.travels exists to prevent crashes
    const visitedData = [
        {% if site.data.travels %}
            {% for trip in site.data.travels %}
            {
                id: "{{ trip.id }}",
                country: "{{ trip.country }}",
                color: "{{ trip.color }}",
                posts: [
                    {% for post in trip.posts %}
                    {
                        title: "{{ post.title }}",
                        type: "{{ post.type }}",
                        url: "{{ post.url }}",
                        icon: "{{ post.icon | default: 'fa-link' }}"
                    },
                    {% endfor %}
                ]
            },
            {% endfor %}
        {% endif %}
    ];

    const visitedMap = new Map(visitedData.map(d => [d.id, d]));

    // 2. Init Globe
    // Wait for container to exist
    document.addEventListener('DOMContentLoaded', () => {
        const globeContainer = document.getElementById('globe-viz');
        
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(countries => {
                
                const world = Globe()
                    (globeContainer)
                    .backgroundColor('#ffffff')
                    .globeImageUrl(null) // No texture = clean white globe
                    .width(globeContainer.clientWidth)
                    .height(globeContainer.clientHeight)
                    
                    // Polygons
                    .polygonsData(countries.features)
                    .polygonCapColor(d => {
                        const data = visitedMap.get(d.properties.ISO_A3);
                        return data ? data.color : '#f0f0f0'; // Light grey for unvisited
                    })
                    .polygonSideColor(() => 'rgba(0,0,0,0.05)')
                    .polygonStrokeColor(() => '#111') // Black borders
                    .polygonAltitude(0.01)

                    // Events
                    .onPolygonClick(d => {
                        const iso = d.properties.ISO_A3;
                        const data = visitedMap.get(iso);
                        if (data) {
                            renderPanel(data);
                            // Point camera at country
                             world.pointOfView({ lat: d.bbox ? (d.bbox[1]+d.bbox[3])/2 : 0, lng: d.bbox ? (d.bbox[0]+d.bbox[2])/2 : 0, altitude: 1.5 }, 1000);
                        }
                    })
                    .onPolygonHover(d => {
                        globeContainer.style.cursor = (d && visitedMap.has(d.properties.ISO_A3)) ? 'pointer' : 'default';
                    });

                // Controls
                world.controls().autoRotate = true;
                world.controls().autoRotateSpeed = 0.5;
                world.controls().enableZoom = true;

                // Responsive Resize
                window.addEventListener('resize', () => {
                    world.width(globeContainer.clientWidth);
                    world.height(globeContainer.clientHeight);
                });
            });
    });

    function renderPanel(data) {
        const panel = document.getElementById('info-panel');
        const cards = data.posts.map(post => `
            <a href="${post.url}" target="_blank" class="think-card">
                <i class="fa ${post.icon}" style="font-size: 1.5em; width: 30px; text-align: center;"></i>
                <div>
                    <div style="font-weight: bold;">${post.title}</div>
                    <div style="font-size: 0.8em; opacity: 0.7;">${post.type}</div>
                </div>
            </a>
        `).join('');

        panel.innerHTML = `
            <h1 style="font-family: var(--header-font); font-size: 2.5rem; margin-bottom: 0;">${data.country}</h1>
            <div style="height: 4px; width: 50px; background: ${data.color}; margin-bottom: 2rem;"></div>
            ${cards}
        `;
    }
</script>
