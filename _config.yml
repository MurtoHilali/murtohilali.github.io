site: Murto Hilali
title: Murto Hilali - Compbio, tech, proteins, and more.
description: >-
  My digital garden & portfolio. I write about computational biology, tech, proteins, and more.
lang: en
image: /img/share-card.png
timezone:  Toronto
repo: https://github.com/MurtoHilali/murtohilali.github.io # site repo [optional]
data-theme: light # default theme "dark" | "light"
discus-identifier: webthme
default-thumb: /img/thumb/default.webp

author:
  name: Murto Hilali
  url: https://murto.co/
  bio: Computational biology and protein design. UWaterloo Biotech/Econ '26. # TODO(murto): confirm bio wording
  avatar: /img/author/website-headshot.jpeg
  username: murto # general username
  github: MurtoHilali # github username
  twitter: MurtoHilali # twitter username
  email: hilali.murto@gmail.com # email adress

twitter:
  username: MurtoHilali
  card: summary_large_image

# URL settings
url: "https://murto.co" # Served from main via GitHub Pages; custom domain in CNAME
baseurl: ""
permalink: pretty


markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge


exclude:
  - .jekyll-cache
  - .obsidian
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - CONTRIBUTING.md
  - notes/
  
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-redirect-from
paginate: 20
paginate_path: "/page/:num"

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /:slug/
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
    values:
      image: /img/share-card.png


relative_links:
  enabled:     true
  collections: false


